name: Build PJSUA2 Android (16KB safe, static OpenSSL)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_API: 23
  OPENSSL_VERSION: 3.4.0

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential swig cmake libtool pkg-config curl

      - name: Download OpenSSL
        run: |
          curl -L https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz -o openssl.tar.gz
          tar -xzf openssl.tar.gz

      - name: Configure config_site.h
        run: |
          cat <<EOF > pjlib/include/pj/config_site.h
          #define PJ_CONFIG_ANDROID 1
          #define PJMEDIA_HAS_G711_CODEC 1
          #define PJMEDIA_HAS_G7221_CODEC 1
          #define PJMEDIA_HAS_VIDEO 0
          #define PJMEDIA_AUDIO_DEV_HAS_ANDROID_JNI 1
          #define PJMEDIA_AUDIO_DEV_HAS_OPENSL 1
          #define PJSIP_HAS_TLS 1
          #define PJ_HAS_SSL_SOCK 1
          #define PJSUA_MAX_ACC 10
          #include <pj/config_site_sample.h>
          EOF

      - uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: pjsua2-${{ github.run_id }}

  build:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: [ arm64-v8a, armeabi-v7a, x86, x86_64 ]

    steps:
      - uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: pjsua2-${{ github.run_id }}

      - name: Set toolchain
        run: |
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH

          echo "CFLAGS=-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1" >> $GITHUB_ENV
          echo "CXXFLAGS=-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1" >> $GITHUB_ENV
          echo "LDFLAGS=-Wl,--no-rosegment" >> $GITHUB_ENV
          echo "LIBS=-lssl -lcrypto" >> $GITHUB_ENV

      - name: Build OpenSSL (static) ${{ matrix.abi }}
        run: |
          cd openssl-${OPENSSL_VERSION}

          case "${{ matrix.abi }}" in
            arm64-v8a)
              export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang
              TARGET=android-arm64 ;;
            armeabi-v7a)
              export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi${ANDROID_API}-clang
              TARGET=android-arm ;;
            x86)
              export CC=$TOOLCHAIN/bin/i686-linux-android${ANDROID_API}-clang
              TARGET=android-x86 ;;
            x86_64)
              export CC=$TOOLCHAIN/bin/x86_64-linux-android${ANDROID_API}-clang
              TARGET=android-x86_64 ;;
          esac

          ./Configure $TARGET \
            -D__ANDROID_API__=${ANDROID_API} \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1 \
            no-shared no-tests

          make -j$(nproc)

          mkdir -p lib
          cp libssl.a libcrypto.a lib/

      - name: Build PJSIP / PJSUA2
        run: |
          export OPENSSL_DIR=${{ github.workspace }}/openssl-${OPENSSL_VERSION}
          export CFLAGS="$CFLAGS -I$OPENSSL_DIR/include"
          export LDFLAGS="$LDFLAGS -L$OPENSSL_DIR/lib"

          ./configure-android \
            --use-ndk-cflags \
            --with-ssl=$OPENSSL_DIR

          make dep
          make clean
          make -j$(nproc)

          cd pjsip-apps/src/swig
          make

      - name: Upload Java bindings
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: java-bindings
          path: pjsip-apps/src/swig/java/android

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: pjsua2-${{ matrix.abi }}
          path: pjsip-apps/src/swig/java/android/pjsua2/src/main/jniLibs

  aar:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Assemble AAR
        run: |
          mkdir -p android-lib
          cp -r java-bindings/* android-lib/
          cp -r pjsua2-*/* android-lib/pjsua2/src/main/jniLibs/

          cd android-lib
          chmod +x gradlew
          ./gradlew clean
          ./gradlew :pjsua2:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pjsua2-aar
          path: android-lib/pjsua2/build/outputs/aar/*.aar
